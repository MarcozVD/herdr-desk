[package]
name = "herdr-desk"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "herdr-desk: GUI glassmorphism para herdr"
authors = ["MarcozVD"]

[lib]
name = "herdr_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
sandbox = ["herdr-core/sandbox"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Misma versión que usa Tauri 2.11 (comparte el tipo COM con `with_webview`).
webview2-com = "0.38"
windows-core = "0.61"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
herdr-core = { path = "../crates/herdr-core" }
toml_edit.workspace = true
